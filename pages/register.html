<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Document Ready</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Register to access Document Ready</p>
    <div id="msg" class="alert alert-danger hidden"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" class="form-control" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        <p class="form-hint">Use a password you can remember.</p>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" class="form-control" placeholder="Repeat password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="text-center mt-3 text-muted">
      Already have an account? <a href="login.html">Login here</a>
    </p>
    <p class="text-center mt-2">
      <a href="../index.html" class="btn-ghost">← Back to home</a>
    </p>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/header-footer.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      redirectIfLoggedIn();
      var form = document.getElementById("registerForm");
      var msg = document.getElementById("msg");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("name").value;
        var email = document.getElementById("email").value;
        var pass = document.getElementById("password").value;
        var confirm = document.getElementById("confirm").value;
        msg.classList.add("hidden");
        if (pass !== confirm) {
          msg.textContent = "Passwords do not match.";
          msg.classList.remove("hidden");
          return;
        }
        var result = registerUser(name, email, pass);
        if (!result.ok) {
          msg.textContent = result.msg;
          msg.classList.remove("hidden");
          return;
        }
        /* After register, send user to login */
        alert(result.msg);
        window.location.href = "login.html";
      });
    });
  </script>
</body>
</html>
