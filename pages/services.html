<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services – Document Ready</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <p class="text-muted mb-3">Choose a service, view required documents and track your preparation.</p>
    <div class="services-toolbar">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Search services..." aria-label="Search services">
      </div>
      <select id="categoryFilter" class="filter-select" aria-label="Filter by category">
        <option value="">All categories</option>
      </select>
    </div>
    <div class="services-grid" id="servicesGrid"></div>
    <div class="empty-state hidden" id="noResults">
      <div class="icon">🔍</div>
      <p>No services match your search.</p>
    </div>
  </div>

  <script src="../js/services-data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/header-footer.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!requireAuth()) return;
      initShell("services", "Services");
      fillCategories();
      renderServices(SERVICES);
      document.getElementById("searchInput").addEventListener("input", filterServices);
      document.getElementById("categoryFilter").addEventListener("change", filterServices);
    });

    function fillCategories() {
      var select = document.getElementById("categoryFilter");
      getCategories().forEach(function (cat) {
        var opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function filterServices() {
      var q = document.getElementById("searchInput").value.trim().toLowerCase();
      var cat = document.getElementById("categoryFilter").value;
      var filtered = SERVICES.filter(function (s) {
        var matchQ = !q || s.name.toLowerCase().indexOf(q) !== -1 || s.short.toLowerCase().indexOf(q) !== -1 || s.category.toLowerCase().indexOf(q) !== -1;
        var matchCat = !cat || s.category === cat;
        return matchQ && matchCat;
      });
      renderServices(filtered);
    }

    function renderServices(list) {
      var grid = document.getElementById("servicesGrid");
      var empty = document.getElementById("noResults");
      if (!list.length) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }
      empty.classList.add("hidden");
      var html = "";
      list.forEach(function (s) {
        var pct = calcProgressPercent(s.id);
        html += '<article class="service-card">';
        html += '<div class="icon">' + s.icon + '</div>';
        html += '<h3>' + escapeHtml(s.name) + '</h3>';
        html += '<p>' + escapeHtml(s.short) + '</p>';
        html += '<div class="meta">' + escapeHtml(s.category) + ' · ' + escapeHtml(s.feeNote) + '</div>';
        if (pct > 0) {
          html += '<div class="progress-wrap"><div class="progress-label"><span>Your progress</span><span>' + pct + '%</span></div>';
          html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>';
        }
        html += '<a href="apply.html?id=' + encodeURIComponent(s.id) + '" class="btn btn-primary btn-block">Apply</a>';
        html += '</article>';
      });
      grid.innerHTML = html;
    }
  </script>
</body>
</html>
