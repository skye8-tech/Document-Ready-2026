<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Document Ready</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to continue</p>
    <div id="msg" class="alert alert-danger hidden"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="text-center mt-3 text-muted">
      No account yet? <a href="register.html">Create one</a>
    </p>
    <p class="text-center mt-2">
      <a href="../index.html" class="btn-ghost">← Back to home</a>
    </p>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/header-footer.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      redirectIfLoggedIn();
      var form = document.getElementById("loginForm");
      var msg = document.getElementById("msg");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("email").value;
        var pass = document.getElementById("password").value;
        msg.classList.add("hidden");
        var result = loginUser(email, pass);
        if (!result.ok) {
          msg.textContent = result.msg;
          msg.classList.remove("hidden");
          return;
        }
        window.location.href = "dashboard.html";
      });
    });
  </script>
</body>
</html>
